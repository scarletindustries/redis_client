services:
  redis:
    image: redis:latest
    ports: ['5379:6379']

  # The same server again, speaking TLS and nothing else: `--port 0` closes the
  # plaintext listener, so a client that fails to negotiate TLS here gets
  # nothing rather than falling back to cleartext against the same data. That
  # is what `test/tls.scrl` relies on to tell a rig exercising TLS from one
  # quietly not.
  #
  # The certificates are minted by `test/gen-tls-certs.sh`, which has to have
  # run before this comes up — the redis image carries no openssl to do it in.
  redis-tls:
    image: redis:latest
    command:
      - redis-server
      - --port
      - '0'
      - --tls-port
      - '6379'
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      # The rig is about verifying the server, so clients present nothing.
      - --tls-auth-clients
      - 'no'
    volumes: ['./test/tls-certs:/certs:ro']
    ports: ['5380:6379']
